<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nội dung số - Lab05</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            line-height: 1.6;
            text-align: center;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 35px;
        }

        .description {
            margin-bottom: 25px;
        }

        .infographic {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
            margin: 20px auto;
        }

        .video {
            width: 100%;
            max-width: 900px;
            height: 500px;
            border: none;
            margin: 20px auto;
            display: block;
        }

        .copyright {
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>Ứng dụng công nghệ số</h1>

    <p class="description">
        Công nghệ số mang lại nhiều lợi ích trong học tập và cuộc sống,
        giúp con người kết nối, học tập, làm việc hiệu quả và sáng tạo hơn.
    </p>

    <img
        src="Lab05_Ex2.1.png"
        alt="Infographic về lợi ích của công nghệ số"
        class="infographic"
    >

    <h2>Giới thiệu lợi ích công nghệ số</h2>

    <iframe
        class="video"
        src="https://www.youtube.com/embed/nGwD909LmVs"
        title="Giới thiệu lợi ích công nghệ số"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

    <p class="copyright">
        Video tạo bởi CapCut, tài liệu từ Pexels/FreeSound (CC0).
    </p>

</body>
</html>
